<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 사상체질 관련 특성 알아보기</title>
  <meta name="description" content="평소 행동과 신체 상태를 돌아보는 간단한 설문입니다.">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#app">본문으로 바로가기</a>

  <header class="topbar">
    <span class="brand">사상체질 관련 특성 설문</span>
    <div class="fontsize" role="group" aria-label="글씨 크기">
      <button type="button" data-size="0" aria-pressed="true">기본</button>
      <button type="button" data-size="1" aria-pressed="false">크게</button>
      <button type="button" data-size="2" aria-pressed="false">아주 크게</button>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <div id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <div class="sheet">
      <h2 id="overlay-title">결과 이미지</h2>
      <p class="sheet-help" id="overlay-help"></p>
      <div class="preview"><img id="preview-img" alt="결과 요약 이미지 미리보기"></div>
      <div class="sheet-actions">
        <button type="button" class="btn btn-primary" id="img-save">이미지 저장</button>
        <button type="button" class="btn btn-ghost" id="img-close">닫기</button>
      </div>
    </div>
  </div>

  <noscript><p style="padding:24px;font-size:20px">이 설문은 자바스크립트가 필요합니다. 브라우저 설정을 확인해 주세요.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/result.js"></script>
  <script src="js/image.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
